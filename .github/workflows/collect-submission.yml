name: Collect submission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - prediction.csv
      - submission_info.json

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download only submission data from exact PR head
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_USER: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR 번호 형식이 올바르지 않습니다."
            exit 1
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PR Commit SHA 형식이 올바르지 않습니다."
            exit 1
          fi

          if ! [[ "$HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Fork 저장소 이름 형식이 올바르지 않습니다."
            exit 1
          fi

          if ! [[ "$GITHUB_USER" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
            echo "::error::GitHub 사용자 이름 형식이 올바르지 않습니다."
            exit 1
          fi

          mkdir -p artifact

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/$HEAD_REPO/$HEAD_SHA/prediction.csv" \
            --output artifact/prediction.csv

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/$HEAD_REPO/$HEAD_SHA/submission_info.json" \
            --output artifact/submission_info.json

          for file in prediction.csv submission_info.json; do
            path="artifact/$file"

            if [ ! -f "$path" ] || [ -L "$path" ]; then
              echo "::error::$file 은 일반 파일이어야 합니다."
              exit 1
            fi
          done

          prediction_size=$(stat -c%s artifact/prediction.csv)
          info_size=$(stat -c%s artifact/submission_info.json)

          if [ "$prediction_size" -gt 2000000 ]; then
            echo "::error::prediction.csv 파일 크기가 너무 큽니다."
            exit 1
          fi

          if [ "$info_size" -gt 20000 ]; then
            echo "::error::submission_info.json 파일 크기가 너무 큽니다."
            exit 1
          fi

          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg github_user "$GITHUB_USER" \
            --arg head_repo "$HEAD_REPO" \
            '{pr_number:$pr_number, head_sha:$head_sha, github_user:$github_user, head_repo:$head_repo}' \
            > artifact/submission_metadata.json

      - name: Upload submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: submission-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
