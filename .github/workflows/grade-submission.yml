name: Grade submission

on:
  workflow_run:
    workflows: ["Collect submission"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: wind-forecast-grading-publisher
  cancel-in-progress: false

jobs:
  grade:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted grader code
        uses: actions/checkout@v4
        with:
          ref: main
          path: public
          persist-credentials: false

      - name: Download submission artifact
        uses: actions/download-artifact@v4
        with:
          name: submission-${{ github.event.workflow_run.id }}
          path: submission
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate downloaded artifact
        shell: bash
        run: |
          set -euo pipefail

          for file in prediction.csv submission_info.json submission_metadata.json; do
            path="submission/$file"

            if [ ! -e "$path" ]; then
              echo "::error::$file 파일이 Artifact에 없습니다."
              exit 1
            fi

            if [ -L "$path" ] || [ ! -f "$path" ]; then
              echo "::error::$file 은 일반 파일이어야 하며 심볼릭 링크일 수 없습니다."
              exit 1
            fi
          done

          if [ "$(stat -c%s submission/prediction.csv)" -gt 2000000 ]; then
            echo "::error::prediction.csv 파일 크기가 너무 큽니다."
            exit 1
          fi

          if [ "$(stat -c%s submission/submission_info.json)" -gt 20000 ]; then
            echo "::error::submission_info.json 파일 크기가 너무 큽니다."
            exit 1
          fi

          if [ "$(stat -c%s submission/submission_metadata.json)" -gt 20000 ]; then
            echo "::error::submission_metadata.json 파일 크기가 너무 큽니다."
            exit 1
          fi

      - name: Verify trusted PR metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(jq -r '.pr_number | tostring' submission/submission_metadata.json)
          ARTIFACT_SHA=$(jq -r '.head_sha' submission/submission_metadata.json)
          ARTIFACT_HEAD_REPO=$(jq -r '.head_repo' submission/submission_metadata.json)
          ARTIFACT_GITHUB_USER=$(jq -r '.github_user' submission/submission_metadata.json)

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR 번호 형식이 올바르지 않습니다."
            exit 1
          fi

          if ! [[ "$ARTIFACT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Artifact의 Commit SHA 형식이 올바르지 않습니다."
            exit 1
          fi

          if ! [[ "$ARTIFACT_HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Artifact의 Fork 저장소 형식이 올바르지 않습니다."
            exit 1
          fi

          if ! [[ "$ARTIFACT_GITHUB_USER" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
            echo "::error::Artifact의 GitHub 사용자 이름 형식이 올바르지 않습니다."
            exit 1
          fi

          PR_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")

          API_PR_NUMBER=$(jq -r '.number | tostring' <<< "$PR_JSON")
          API_HEAD_SHA=$(jq -r '.head.sha' <<< "$PR_JSON")
          API_HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<< "$PR_JSON")
          API_BASE_REPO=$(jq -r '.base.repo.full_name // ""' <<< "$PR_JSON")
          API_BASE_REF=$(jq -r '.base.ref // ""' <<< "$PR_JSON")
          API_GITHUB_USER=$(jq -r '.user.login // ""' <<< "$PR_JSON")

          if [ "$API_PR_NUMBER" != "$PR_NUMBER" ]; then
            echo "::error::PR 번호 검증에 실패했습니다."
            exit 1
          fi

          if [ "$API_HEAD_SHA" != "$ARTIFACT_SHA" ]; then
            echo "::error::현재 PR의 Commit SHA가 Artifact와 일치하지 않습니다."
            exit 1
          fi

          if [ "$API_HEAD_REPO" != "$ARTIFACT_HEAD_REPO" ]; then
            echo "::error::현재 PR의 Fork 저장소가 Artifact와 일치하지 않습니다."
            exit 1
          fi

          if [ "$API_GITHUB_USER" != "$ARTIFACT_GITHUB_USER" ]; then
            echo "::error::현재 PR 작성자가 Artifact와 일치하지 않습니다."
            exit 1
          fi

          if [ "$API_BASE_REPO" != "$GITHUB_REPOSITORY" ] || [ "$API_BASE_REF" != "main" ]; then
            echo "::error::채점 대상 PR의 base 저장소 또는 브랜치가 올바르지 않습니다."
            exit 1
          fi

          {
            echo "PR_NUMBER=$PR_NUMBER"
            echo "HEAD_SHA=$API_HEAD_SHA"
            echo "GITHUB_USER=$API_GITHUB_USER"
            echo "HEAD_REPO=$API_HEAD_REPO"
          } >> "$GITHUB_ENV"

      - name: Checkout private truth data
        uses: actions/checkout@v4
        with:
          repository: Im-spec/wind-power-forecasting-grader-private
          token: ${{ secrets.GRADER_REPO_TOKEN }}
          ref: main
          path: grader-private
          fetch-depth: 1
          persist-credentials: false

      - name: Grade submission
        shell: bash
        run: |
          set -euo pipefail

          python public/scripts/grade_submission.py \
            --prediction submission/prediction.csv \
            --info submission/submission_info.json \
            --truth grader-private/truth/generation_jeonbuk_2025.csv \
            --capacity grader-private/truth/capacity_jeonbuk_2025.csv \
            --result grading_result.json \
            --comment grading_comment.md

      - name: Remove private truth data before publishing
        if: always()
        shell: bash
        run: |
          rm -rf grader-private

      - name: Publish PR result and leaderboard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEADERBOARD_ISSUE: "2"
        run: |
          set -euo pipefail
          python public/scripts/publish_grading_result.py \
            --result grading_result.json \
            --comment grading_comment.md
